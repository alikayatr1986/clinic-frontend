services:
  frontend:
    build:
      context: .
      args:
        API_BASE_URL: ${API_BASE_URL:?Set API_BASE_URL in .env.production}
        SITE_URL: ${SITE_URL:?Set SITE_URL in .env.production}
        CONTACT_ADDRESS_EN: ${CONTACT_ADDRESS_EN:-}
        CONTACT_ADDRESS_AR: ${CONTACT_ADDRESS_AR:-}
        CONTACT_PUBLIC_EMAIL: ${CONTACT_PUBLIC_EMAIL:-}
        CONTACT_PUBLIC_PHONE: ${CONTACT_PUBLIC_PHONE:-}
        CONTACT_WHATSAPP_URL: ${CONTACT_WHATSAPP_URL:-}
        CONTACT_TELEGRAM_URL: ${CONTACT_TELEGRAM_URL:-}
        CONTACT_LOCATIONS_JSON: ${CONTACT_LOCATIONS_JSON:-}
        CONTACT_CAPTCHA_SITE_KEY: ${CONTACT_CAPTCHA_SITE_KEY:-}
        CONTACT_CAPTCHA_ACTION: ${CONTACT_CAPTCHA_ACTION:-}
    env_file: .env.production
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
